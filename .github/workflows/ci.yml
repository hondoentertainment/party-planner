name: CI

# Repository secrets (Settings → Secrets and variables → Actions), all optional:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — real app URL + anon key so the build is not the empty setup screen.
#   VITE_PUBLIC_SITE_URL — canonical origin (no trailing slash); OG + middleware.
#   VITE_SECURITY_CONTACT — RFC 9116 Contact for dist/.well-known/security.txt.
#   VITE_SENTRY_DSN, VITE_PLAUSIBLE_DOMAIN — optional analytics / errors.
#   E2E_EMAIL, E2E_PASSWORD, E2E_DISPLAY_NAME — dedicated Auth user; without email/password, signed-in Playwright tests are skipped.
#   SMOKE_URL — for manual Smoke workflow (OPERATIONS.md §7).
# Optional repo **Variables**: SMOKE_PATHS (space-separated paths; Smoke default `/ /healthz /privacy /terms`).
# See README "E2E and CI" and OPERATIONS.md §7.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
  VITE_SECURITY_CONTACT: ${{ secrets.VITE_SECURITY_CONTACT }}
  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
  VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: npm audit (high+ only, non-blocking)
        run: npm audit --omit=dev --audit-level=high || true
        continue-on-error: true
      - run: npm run lint
      - run: npm run build
      - name: Deploy env parity
        run: node scripts/check-deploy-env.mjs --strict

  e2e:
    needs: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_DISPLAY_NAME: ${{ secrets.E2E_DISPLAY_NAME }}
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
