name: Smoke

# Production HTTP smoke checks.
#
# Triggers:
#   - workflow_dispatch  — run manually any time
#   - deployment_status  — fired automatically by Vercel's GitHub integration
#                          on every deployment; this workflow filters to
#                          successful Production deployments only.
#
# Configuration (Settings → Secrets and variables → Actions):
#   Variable SMOKE_URL    — origin or full URL, e.g. https://party-planner-five.vercel.app
#                           (no trailing slash needed). Falls back to the deployment
#                           target URL when running on `deployment_status`.
#   Variable SMOKE_PATHS  — space-separated paths (default: / /healthz /privacy /terms).

on:
  workflow_dispatch:
  deployment_status:

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    steps:
      - name: Fetch production URLs
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          SMOKE_PATHS: ${{ vars.SMOKE_PATHS }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          base="${SMOKE_URL:-$DEPLOYMENT_URL}"
          base="${base%/}"
          if [ -z "$base" ]; then
            echo "Neither SMOKE_URL variable nor deployment target_url available — skipping."
            exit 0
          fi
          paths="${SMOKE_PATHS:-/ /healthz /privacy /terms}"
          failed=0
          for p in $paths; do
            case "$p" in
              /*) path="$p" ;;
              *) path="/$p" ;;
            esac
            url="${base}${path}"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -L "$url")
            echo "HTTP $code — $url"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              failed=1
            fi
          done
          exit $failed
